<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Soie Studio – Khăn choàng cổ</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&display=swap">
<style>
:root{--bg:#faf6ef;--card:#fffdf9;--ink:#3b3228;--mut:#85755f;--line:#e6dccb;--linen:#eadfcf;--wheat:#d9b982;--btn:#7a5528;--btnt:#fff;--ok:#4b7a4b;--bad:#a8402f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b16;--card:#2a251e;--ink:#f1e9dc;--mut:#b8a891;--line:#40372b;--linen:#3a3227;--wheat:#c9a566;--btn:#d9b982;--btnt:#2a1f10;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1f1b16;--card:#2a251e;--ink:#f1e9dc;--mut:#b8a891;--line:#40372b;--linen:#3a3227;--wheat:#c9a566;--btn:#d9b982;--btnt:#2a1f10;color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
h1,h2,h3{font-family:"Cormorant Garamond",Georgia,serif;margin:0;font-weight:600}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{font-size:28px;font-weight:700;letter-spacing:.5px;flex:1;min-width:130px}
.tabs{display:flex;background:var(--linen);border-radius:999px;padding:3px}
.tabs button{border:0;background:none;color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--btn);color:var(--btnt)}
.cartb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.cartb b{background:var(--wheat);color:#2a1f10;border-radius:999px;padding:1px 8px;margin-left:4px}
main{max-width:1000px;margin:0 auto;padding:14px}
.note{background:var(--linen);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--mut);margin-bottom:12px}
.hero{padding:14px 2px 6px}.hero h1{font-size:34px;line-height:1.1}.hero p{margin:6px 0 0;color:var(--mut)}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:999px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--wheat);border-color:var(--wheat);color:#2a1f10}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:18px}}@media(min-width:960px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:var(--linen)}
.cb{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.cb h3{font-size:19px;line-height:1.2;flex:1}.pr{font-weight:600}.sm{font-size:12px;color:var(--mut)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px;border-radius:10px;font:inherit;font-size:14px;cursor:pointer}
.btn.pri{background:var(--btn);color:var(--btnt);border-color:var(--btn);width:100%;font-weight:600}
.btn.bad{color:var(--bad)}.btn:disabled{opacity:.45;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:24px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:18px 0 8px;flex-wrap:wrap}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}th,td{padding:9px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:var(--linen);font-weight:600}
td img{width:44px;height:44px;object-fit:cover;border-radius:6px}.acts{display:flex;gap:6px}.acts .btn{padding:6px 10px}
#ov{position:fixed;inset:0;background:rgba(30,22,12,.5);z-index:50;display:none;align-items:flex-end;justify-content:center}
#ov.on{display:flex}@media(min-width:700px){#ov{align-items:center}}
#md{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
@media(min-width:700px){#md{border-radius:16px}}
#md h2{font-size:28px;margin-bottom:8px}.ci{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.ci img{width:56px;height:56px;border-radius:8px;object-fit:cover}.ci div{flex:1;font-size:14px}.q{display:flex;align-items:center;gap:6px}.q button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.tot{font-size:18px;font-weight:700;text-align:right;margin:10px 0}
.tag{display:inline-block;padding:2px 10px;border-radius:999px;font-size:12px;background:var(--linen)}
textarea.csv{height:160px;font-size:12px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--btn);color:var(--btnt);padding:10px 16px;border-radius:999px;font-size:14px;z-index:60;display:none}
footer{text-align:center;color:var(--mut);font-size:12px;padding:20px 14px 30px}
:focus-visible{outline:2px solid var(--btn);outline-offset:2px}
</style>
</head>
<body>
<header>
<div class="brand">Soie Studio</div>
<div class="tabs"><button data-a="tab" data-id="shop" class="on">Cửa hàng</button><button data-a="tab" data-id="adm">Quản lý</button></div>
<button class="cartb" data-a="cart">Giỏ hàng <b id="cc">0</b></button>
</header>
<main id="app"></main>
<footer>Soie Studio – bản thử nghiệm (concept only). Ảnh minh họa; phạm vi giao hàng và hạn chót đặt hàng: chưa xác minh.</footer>
<div id="ov"><div id="md"></div></div>
<div id="toast"></div>
<script>
const K='soie_studio_v1',CATS=['Khăn len','Khăn cashmere','Khăn polyester','Combo khăn + hoa'],ST=['Chờ xử lý','Đã giao','Đã hủy'];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const vnd=n=>Number(n||0).toLocaleString('vi-VN')+' ₫';
const ph=c=>'data:image/svg+xml;utf8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"><rect width="400" height="400" fill="#'+c+'"/><path d="M0 150Q100 100 200 150T400 150V240Q300 290 200 240T0 240Z" fill="#fff" opacity=".35"/><text x="200" y="352" text-anchor="middle" font-family="Georgia" font-size="22" fill="#fff" opacity=".85">Ảnh minh họa</text></svg>');
const PH=ph('d9b982');
const img=p=>p.img&&p.img.indexOf('ph:')===0?ph(p.img.slice(3)):(p.img||PH);
const seed=[
['Khăn len đơn sắc sợi to','ph:c9a27a',480000,'Khăn len',20],['Khăn len đơn sắc sợi nhỏ','ph:b8977a',420000,'Khăn len',20],
['Khăn cashmere thêu hình','ph:d6c3a5',1250000,'Khăn cashmere',10],['Khăn cashmere màu sắc','ph:a88c6d',1100000,'Khăn cashmere',10],
['Khăn polyester đơn sắc','ph:cdb89a',300000,'Khăn polyester',30],['Khăn polyester pha màu họa tiết','ph:bfa27c',320000,'Khăn polyester',30],
['Combo khăn len + hoa tươi','ph:d9b982',690000,'Combo khăn + hoa',15],['Combo khăn cashmere + hoa tươi','ph:caa66f',1490000,'Combo khăn + hoa',8]
].map((a,i)=>({id:'p'+(i+1),name:a[0],img:a[1],price:a[2],cat:a[3],stock:a[4]}));
let D,S={tab:'shop',cat:'Tất cả',q:'',eid:null};
function load(){try{D=JSON.parse(localStorage.getItem(K))}catch(e){D=null}
 if(!D||!Array.isArray(D.products))D={products:seed,cart:[],orders:[],seq:1}}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
function modal(h){$('#md').innerHTML=h;$('#ov').classList.add('on')}
function close(){$('#ov').classList.remove('on')}
function ask(msg,fn){window._yes=fn;modal('<h2>Xác nhận</h2><p>'+esc(msg)+'</p><div class="acts"><button class="btn bad" data-a="yes">Đồng ý</button><button class="btn" data-a="close">Hủy</button></div>')}
const cnt=()=>{$('#cc').textContent=D.cart.reduce((s,c)=>s+c.qty,0)};
const prod=id=>D.products.find(p=>p.id===id);
function render(){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.id===S.tab));cnt();
 if(S.tab==='shop'){$('#app').innerHTML='<div class="hero"><h1>Khăn choàng cổ len và cashmere</h1><p>Chọn khăn, thêm hoa tươi, gửi tặng người thương.</p></div>'+
 '<div class="note">Bản thử nghiệm: chưa nhận thanh toán thật. Đơn hàng chỉ lưu trên trình duyệt này.</div>'+
 '<input id="q" type="search" placeholder="Tìm sản phẩm theo tên" value="'+esc(S.q)+'" aria-label="Tìm sản phẩm">'+
 '<div class="chips">'+['Tất cả'].concat(CATS).map(c=>'<button class="chip'+(S.cat===c?' on':'')+'" data-a="cat" data-id="'+esc(c)+'">'+esc(c)+'</button>').join('')+'</div><div id="grid" class="grid"></div>';grid()}
 else admin()}
function grid(){const q=S.q.trim().toLowerCase();
 const l=D.products.filter(p=>(S.cat==='Tất cả'||p.cat===S.cat)&&p.name.toLowerCase().includes(q));
 $('#grid').innerHTML=l.length?l.map(p=>'<article class="card"><img src="'+esc(img(p))+'" alt="'+esc(p.name)+'" onerror="this.onerror=null;this.src=PH"><div class="cb"><h3>'+esc(p.name)+'</h3><div class="pr">'+vnd(p.price)+'</div><div class="sm">'+(p.stock>0?'Còn '+p.stock+' sản phẩm':'Tạm hết hàng')+'</div><button class="btn pri" data-a="add" data-id="'+p.id+'"'+(p.stock<1?' disabled':'')+'>'+(p.stock<1?'Hết hàng':'Thêm vào giỏ')+'</button></div></article>').join(''):'<p class="sm">Không tìm thấy sản phẩm. Hãy thử từ khóa hoặc danh mục khác.</p>'}
function cartRows(){const it=D.cart.map(c=>({c,p:prod(c.id)})).filter(x=>x.p);const t=it.reduce((s,x)=>s+x.p.price*x.c.qty,0);
 $('#ci').innerHTML=it.map(x=>'<div class="ci"><img src="'+esc(img(x.p))+'" alt="" onerror="this.onerror=null;this.src=PH"><div>'+esc(x.p.name)+'<br><span class="sm">'+vnd(x.p.price)+'</span></div><div class="q"><button data-a="dec" data-id="'+x.p.id+'" aria-label="Giảm">−</button>'+x.c.qty+'<button data-a="inc" data-id="'+x.p.id+'" aria-label="Tăng">+</button><button data-a="rm" data-id="'+x.p.id+'" aria-label="Xóa">✕</button></div></div>').join('')||'<p class="sm">Giỏ hàng đang trống.</p>';
 $('#ct').textContent=vnd(t);cnt();return t}
function cartModal(){
 modal('<h2>Giỏ hàng</h2><div id="ci"></div><div class="tot">Tổng tiền: <span id="ct"></span></div><h3>Thông tin đặt hàng</h3>'+
 '<label>Họ tên *</label><input id="fn" autocomplete="name"><label>Số điện thoại *</label><input id="fp" type="tel" inputmode="tel" autocomplete="tel"><label>Địa chỉ giao hàng *</label><input id="fa" autocomplete="street-address">'+
 '<label>Ngày muốn nhận hàng (không bắt buộc)</label><input id="fd" type="date"><label>Lời nhắn trên thiệp (không bắt buộc)</label><textarea id="fm" rows="2"></textarea><label>Ghi chú</label><textarea id="fg" rows="2"></textarea>'+
 '<p class="sm" id="er" style="color:var(--bad)"></p><button class="btn pri" data-a="order">Xác nhận đặt hàng</button><p class="sm">Phí giao hàng và thời gian giao: chưa xác minh.</p><button class="btn" style="width:100%;margin-top:8px" data-a="close">Tiếp tục xem sản phẩm</button>');cartRows()}
function order(){const v=i=>$('#'+i).value.trim();const e=$('#er');
 if(!D.cart.length){e.textContent='Giỏ hàng đang trống.';return}
 if(!v('fn')||!v('fa')){e.textContent='Vui lòng nhập họ tên và địa chỉ giao hàng.';return}
 if(!/^0\d{9,10}$/.test(v('fp').replace(/[\s.\-]/g,''))){e.textContent='Số điện thoại chưa đúng (ví dụ 0912345678).';return}
 const items=[];let total=0;
 for(const c of D.cart){const p=prod(c.id);if(!p)continue;if(c.qty>p.stock){e.textContent='“'+p.name+'” chỉ còn '+p.stock+' sản phẩm.';return}items.push({name:p.name,price:p.price,qty:c.qty,id:p.id});total+=p.price*c.qty}
 const o={id:'DH'+String(D.seq++).padStart(4,'0'),date:new Date().toLocaleString('vi-VN'),name:v('fn'),phone:v('fp'),addr:v('fa'),ddate:v('fd'),card:v('fm'),note:v('fg'),items,total,status:ST[0]};
 items.forEach(i=>{prod(i.id).stock-=i.qty});D.orders.unshift(o);D.cart=[];save();cnt();
 modal('<h2>Đặt hàng thành công</h2><p>Mã đơn của bạn: <b>'+o.id+'</b>. Soie Studio sẽ liên hệ qua số điện thoại để xác nhận.</p><button class="btn pri" data-a="close">Đóng</button>');S.tab==='shop'&&render()}
function admin(){const rev=D.orders.filter(o=>o.status!==ST[2]).reduce((s,o)=>s+o.total,0);
 $('#app').innerHTML='<div class="stats"><div class="stat"><span class="sm">Sản phẩm đang bán</span><b>'+D.products.length+'</b></div><div class="stat"><span class="sm">Tổng số đơn</span><b>'+D.orders.length+'</b></div><div class="stat"><span class="sm">Doanh thu dự kiến</span><b>'+vnd(rev)+'</b></div></div>'+
 '<div class="bar"><h2>Kho sản phẩm</h2><button class="btn" data-a="pnew">+ Thêm sản phẩm mới</button></div><div class="tw"><table><tr><th>Ảnh</th><th>Tên</th><th>Danh mục</th><th>Giá</th><th>Kho</th><th></th></tr>'+
 D.products.map(p=>'<tr><td><img src="'+esc(img(p))+'" alt="" onerror="this.onerror=null;this.src=PH"></td><td>'+esc(p.name)+'</td><td>'+esc(p.cat)+'</td><td>'+vnd(p.price)+'</td><td>'+p.stock+'</td><td class="acts"><button class="btn" data-a="pedit" data-id="'+p.id+'">Sửa</button><button class="btn bad" data-a="pdel" data-id="'+p.id+'">Xóa</button></td></tr>').join('')+'</table></div>'+
 '<div class="bar"><h2>Đơn hàng</h2><button class="btn" data-a="export">Xuất file đơn hàng</button></div><div class="tw"><table><tr><th>Mã đơn</th><th>Ngày đặt</th><th>Khách</th><th>SĐT</th><th>Tổng tiền</th><th>Trạng thái</th><th></th></tr>'+
 (D.orders.map(o=>'<tr><td>'+o.id+'</td><td>'+esc(o.date)+'</td><td>'+esc(o.name)+'</td><td>'+esc(o.phone)+'</td><td>'+vnd(o.total)+'</td><td><select data-st="'+o.id+'">'+ST.map(s=>'<option'+(s===o.status?' selected':'')+'>'+s+'</option>').join('')+'</select></td><td class="acts"><button class="btn" data-a="oview" data-id="'+o.id+'">Xem chi tiết</button><button class="btn bad" data-a="odel" data-id="'+o.id+'">Xóa</button></td></tr>').join('')||'<tr><td colspan="7" class="sm">Chưa có đơn hàng. Hãy đặt thử ở tab Cửa hàng.</td></tr>')+'</table></div>'}
function pform(p){p=p||{name:'',img:'',price:'',cat:CATS[0],stock:10};S.eid=p.id||null;
 modal('<h2>'+(p.id?'Sửa sản phẩm':'Thêm sản phẩm mới')+'</h2><label>Tên sản phẩm</label><input id="pn" value="'+esc(p.name)+'"><label>URL hình ảnh (để trống để dùng ảnh minh họa)</label><input id="pi" value="'+esc(p.img&&p.img.indexOf('ph:')===0?'':p.img)+'"><label>Giá tiền (VNĐ)</label><input id="pp" type="number" min="0" inputmode="numeric" value="'+esc(p.price)+'"><label>Danh mục</label><select id="pc">'+CATS.map(c=>'<option'+(c===p.cat?' selected':'')+'>'+c+'</option>').join('')+'</select><label>Số lượng kho</label><input id="ps" type="number" min="0" inputmode="numeric" value="'+esc(p.stock)+'"><p class="sm" id="er" style="color:var(--bad)"></p><button class="btn pri" data-a="psave">Lưu sản phẩm</button>')}
function psave(){const n=$('#pn').value.trim(),pr=Math.round(+$('#pp').value),st=Math.round(+$('#ps').value);
 if(!n||!(pr>=0)||$('#pp').value===''||!(st>=0)){$('#er').textContent='Vui lòng nhập tên, giá và số lượng hợp lệ.';return}
 const old=S.eid&&prod(S.eid);let im=$('#pi').value.trim();if(!im)im=old&&old.img&&old.img.indexOf('ph:')===0?old.img:'ph:d9b982';
 const d={name:n,img:im,price:pr,cat:$('#pc').value,stock:st};
 if(old)Object.assign(old,d);else D.products.push(Object.assign({id:'p'+Date.now()},d));
 save();close();render();toast('Đã lưu sản phẩm')}
function csv(){const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const h=['Mã đơn','Ngày đặt','Họ tên','Số điện thoại','Địa chỉ','Ngày muốn nhận','Lời nhắn thiệp','Ghi chú','Sản phẩm','Tổng tiền','Trạng thái'];
 return [h.map(q).join(',')].concat(D.orders.map(o=>[o.id,o.date,o.name,o.phone,o.addr,o.ddate,o.card,o.note,o.items.map(i=>i.name+' x'+i.qty).join('; '),o.total,o.status].map(q).join(','))).join('\r\n')}
function exp(){const t=csv();modal('<h2>Xuất file đơn hàng</h2><p class="sm">Bấm “Tải file CSV”. Nếu trình duyệt không tải được, bấm “Sao chép” rồi dán vào Excel hoặc Google Sheets.</p><textarea class="csv" id="cv" readonly>'+esc(t)+'</textarea><div class="acts" style="margin-top:10px"><button class="btn pri" style="width:auto" data-a="dl">Tải file CSV</button><button class="btn" data-a="cp">Sao chép</button><button class="btn" data-a="close">Đóng</button></div>')}
function dl(){try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv()],{type:'text/csv;charset=utf-8'}));a.download='don-hang-soie-studio.csv';document.body.appendChild(a);a.click();a.remove();toast('Đang tải file…')}catch(e){toast('Không tải được, hãy dùng nút Sao chép')}}
function cp(){const t=$('#cv');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}toast(ok?'Đã sao chép':'Hãy chọn và sao chép thủ công')}
function oview(id){const o=D.orders.find(x=>x.id===id);if(!o)return;
 modal('<h2>Đơn '+o.id+'</h2><p class="sm">'+esc(o.date)+' · <span class="tag">'+o.status+'</span></p><p><b>'+esc(o.name)+'</b> – '+esc(o.phone)+'<br>'+esc(o.addr)+'</p>'+o.items.map(i=>'<div class="ci"><div>'+esc(i.name)+' × '+i.qty+'</div><b>'+vnd(i.price*i.qty)+'</b></div>').join('')+'<div class="tot">'+vnd(o.total)+'</div>'+(o.ddate?'<p>Ngày muốn nhận: '+esc(o.ddate)+'</p>':'')+(o.card?'<p>Lời nhắn thiệp: '+esc(o.card)+'</p>':'')+(o.note?'<p>Ghi chú: '+esc(o.note)+'</p>':'')+'<button class="btn pri" data-a="close">Đóng</button>')}
const A={
 tab:id=>{S.tab=id;render()},cat:id=>{S.cat=id;render()},cart:()=>cartModal(),close,yes:()=>{const f=window._yes;window._yes=null;close();f&&f()},
 add:id=>{const p=prod(id);let c=D.cart.find(x=>x.id===id);if((c?c.qty:0)+1>p.stock){toast('Chỉ còn '+p.stock+' sản phẩm');return}c?c.qty++:D.cart.push({id,qty:1});save();cnt();toast('Đã thêm vào giỏ')},
 inc:id=>{const c=D.cart.find(x=>x.id===id),p=prod(id);if(c.qty+1>p.stock){toast('Chỉ còn '+p.stock+' sản phẩm');return}c.qty++;save();cartRows()},
 dec:id=>{const c=D.cart.find(x=>x.id===id);c.qty--;if(c.qty<1)D.cart=D.cart.filter(x=>x!==c);save();cartRows()},
 rm:id=>{D.cart=D.cart.filter(x=>x.id!==id);save();cartRows()},order,
 pnew:()=>pform(),pedit:id=>pform(prod(id)),psave,
 pdel:id=>ask('Xóa sản phẩm này khỏi danh sách bán?',()=>{D.products=D.products.filter(p=>p.id!==id);D.cart=D.cart.filter(c=>c.id!==id);save();render()}),
 oview,odel:id=>ask('Xóa đơn hàng '+id+'? Không thể hoàn tác.',()=>{D.orders=D.orders.filter(o=>o.id!==id);save();render()}),
 export:exp,dl,cp};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a]){A[b.dataset.a](b.dataset.id)}else if(e.target.id==='ov')close()});
document.addEventListener('change',e=>{const s=e.target.dataset&&e.target.dataset.st;if(s){const o=D.orders.find(x=>x.id===s);o.status=e.target.value;save();admin();toast('Đã cập nhật trạng thái')}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;grid()}});
load();render();
</script>
</body>
</html>
